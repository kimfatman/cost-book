<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>算得清 Logo 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f5f6f8; color: #0B1836; padding: 40px; }
  h1 { font-size: 28px; margin-bottom: 32px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
  .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #0B1836; opacity: 0.8; }
  .card img { width: 100%; height: auto; border-radius: 8px; }
  .card.dark { background: #0B1836; }
  .card.dark h2 { color: #fff; opacity: 0.7; }
</style>
</head>
<body>
  <h1>算得清 Logo System Preview</h1>
  <div class='grid'>
    <div class='card'><h2>1. 标准横版组合</h2><img src='assets/logo-horizontal.svg' alt='横版组合'/></div>
    <div class='card'><h2>2. 图标标识（独立）</h2><img src='assets/logo-icon.svg' alt='图标'/></div>
    <div class='card'><h2>3. 单色 — 深蓝（白底）</h2><img src='assets/logo-mono-navy.svg' alt='深蓝单色'/></div>
    <div class='card dark'><h2>4. 单色 — 白色（深蓝底）</h2><img src='assets/logo-mono-white.svg' alt='白色单色'/></div>
    <div class='card'><h2>5. 单色 — 黑色（白底印刷）</h2><img src='assets/logo-mono-black.svg' alt='黑色单色'/></div>
  </div>
</body>
</html>
